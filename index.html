<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotdog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink-deep: #e83e8c;
      --pink-mid: #ff6b9d;
      --pink-soft: #ffb3c9;
      --pink-wash: #ffe0eb;
      --bun: #e8a45c;
      --bun-shadow: #c47d3a;
      --sausage: #c44b3c;
      --mustard: #f5c518;
      --ketchup: #d62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Fredoka", sans-serif;
      color: #7a1f45;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, var(--pink-wash) 0%, transparent 55%),
        radial-gradient(circle at 15% 80%, rgba(255, 107, 157, 0.45) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(255, 179, 201, 0.7) 0%, transparent 35%),
        linear-gradient(165deg, var(--pink-soft) 0%, var(--pink-mid) 45%, var(--pink-deep) 100%);
      overflow: hidden;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 0 rgba(122, 31, 69, 0.12);
      animation: bob 3.2s ease-in-out infinite;
    }

    p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 500;
      opacity: 0.85;
      max-width: 18ch;
    }

    .hotdog {
      width: min(72vw, 340px);
      height: auto;
      filter: drop-shadow(0 18px 28px rgba(122, 31, 69, 0.28));
      animation: sway 4s ease-in-out infinite;
      transform-origin: center center;
    }

    .hotdog .mustard {
      animation: drizzle 2.4s ease-in-out infinite;
      transform-origin: center;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(2px);
    }

    .blob-a {
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.22);
      top: 12%;
      left: 8%;
      animation: drift 8s ease-in-out infinite;
    }

    .blob-b {
      width: 120px;
      height: 120px;
      background: rgba(255, 107, 157, 0.35);
      bottom: 15%;
      right: 12%;
      animation: drift 10s ease-in-out infinite reverse;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-10px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes drizzle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -22px); }
    }
  </style>
</head>
<body>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>

  <main class="stage">
    <h1>Hotdog</h1>
    <svg class="hotdog" viewBox="0 0 280 160" role="img" aria-label="A smiling hotdog in a bun">
      <!-- bottom bun -->
      <ellipse cx="140" cy="118" rx="118" ry="32" fill="#c47d3a" />
      <ellipse cx="140" cy="110" rx="118" ry="32" fill="#e8a45c" />
      <ellipse cx="140" cy="104" rx="100" ry="22" fill="#f0b872" opacity="0.5" />

      <!-- sausage -->
      <rect x="48" y="62" width="184" height="44" rx="22" fill="#c44b3c" />
      <ellipse cx="48" cy="84" rx="18" ry="22" fill="#c44b3c" />
      <ellipse cx="232" cy="84" rx="18" ry="22" fill="#c44b3c" />
      <ellipse cx="140" cy="74" rx="90" ry="12" fill="#d65a4a" opacity="0.55" />

      <!-- mustard -->
      <path
        class="mustard"
        d="M62 84 C88 70, 110 98, 140 82 S192 70, 218 88"
        fill="none"
        stroke="#f5c518"
        stroke-width="8"
        stroke-linecap="round"
      />

      <!-- ketchup drizzle -->
      <path
        d="M70 92 C96 104, 118 78, 148 94 S200 108, 214 86"
        fill="none"
        stroke="#d62828"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.9"
      />

      <!-- top bun -->
      <ellipse cx="140" cy="58" rx="118" ry="36" fill="#e8a45c" />
      <ellipse cx="140" cy="50" rx="100" ry="24" fill="#f0b872" opacity="0.55" />
      <ellipse cx="95" cy="48" rx="10" ry="6" fill="#c47d3a" opacity="0.35" />
      <ellipse cx="140" cy="42" rx="8" ry="5" fill="#c47d3a" opacity="0.3" />
      <ellipse cx="185" cy="50" rx="9" ry="5" fill="#c47d3a" opacity="0.35" />

      <!-- face -->
      <circle cx="118" cy="84" r="4" fill="#5c2418" />
      <circle cx="162" cy="84" r="4" fill="#5c2418" />
      <path d="M128 96 Q140 106 152 96" fill="none" stroke="#5c2418" stroke-width="3" stroke-linecap="round" />
    </svg>
    <p>One dog. Zero regrets.</p>
  </main>
</body>
</html>
